services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caturza_finance
      POSTGRES_USER: caturza
      POSTGRES_PASSWORD: caturza_dev
    ports:
      - "5433:5432"
    volumes:
      - caturza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caturza -d caturza_finance"]
      interval: 5s
      retries: 12
volumes:
  caturza_pgdata:
