spring.application.name=caturza-financing-statement
server.port=${PORT:8080}
# Zero-setup persistent local database. See application-postgres.properties for PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/caturza-finance;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=always
