<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1b34" />
  <meta name="description" content="Caturza Financing Statement — manage income, expenses and downloadable monthly financial statements." />
  <title>Caturza Financing Statement</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark">CF<span class="brand-dot">.</span></div>
        <div><div class="brand-title">CATURZA</div><div class="brand-subtitle">FINANCING STATEMENT</div></div>
      </div>
      <div class="sidebar-divider"></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Dashboard</span><span class="nav-chevron">↗</span>
        </button>
      </nav>
      <div class="nav-label months-label">MONTHLY STATEMENTS <span id="nav-year">2026</span></div>
      <nav class="sidebar-nav months-nav" id="months-nav" aria-label="Monthly statements"></nav>
      <div class="sidebar-footer">
        <button class="footer-action" id="backup-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>
          <span>Backup & settings</span>
        </button>
        <div class="storage-notice"><span class="storage-led"></span><div><strong>Saved on this device</strong><small>Back up your records regularly</small></div></div>
      </div>
    </aside>
    <div class="mobile-overlay" id="mobile-overlay"></div>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" id="menu-button" type="button" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="breadcrumb-label">PERSONAL FINANCE</span><span class="breadcrumb-sep">/</span><span id="breadcrumb-current">Dashboard</span></div>
        <div class="topbar-right">
          <div class="year-switcher" aria-label="Selected financial year"><button id="previous-year" type="button" title="Previous year" aria-label="Previous year">‹</button><span id="year-label">2026</span><button id="next-year" type="button" title="Next year" aria-label="Next year">›</button></div>
          <button class="primary-button global-add" id="add-transaction" type="button"><span class="plus">+</span> Add transaction</button>
        </div>
      </header>
      <main class="main-content" id="main-content"></main>
      <footer class="app-footer"><span>© <span id="copyright-year"></span> Caturza Financing Statement</span><span>Private, local-first finance tracker</span></footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js" defer></script>
</body>
</html>
